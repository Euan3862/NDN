name: Track Overleaf Word Count

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Give the workflow permission to commit the CSV updates back to the repo
permissions:
  contents: write

jobs:
  track-word-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TeXcount Script
        run: |
          curl -sL https://raw.githubusercontent.com/pleac/texcount/master/texcount.pl -o texcount.pl
          chmod +x texcount.pl

- name: Calculate Word Count
        id: count
        run: |
          TEX_FILE="main.tex"
          echo "Found LaTeX file: $TEX_FILE"
          
          RAW_COUNT=$(perl texcount.pl -1 -sum -brief "$TEX_FILE" 2>/dev/null || echo "0")
          WORD_COUNT=$(echo "$RAW_COUNT" | tr -dc '0-9')
          
          if [ -z "$WORD_COUNT" ]; then
            WORD_COUNT=0
          fi
          
          echo "word_count=$WORD_COUNT" >> $GITHUB_OUTPUT
          echo "Current word count: $WORD_COUNT"

- name: Update Word History CSV
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M')
          COUNT="${{ steps.count.outputs.word_count }}"
          
          # Create file with headers if it doesn't exist
          if [ ! -f "word_history.csv" ]; then
            echo "date,count" > word_history.csv
          fi
          
          # Append the new entry
          echo "$DATE,$COUNT" >> word_history.csv

      - name: Pull latest changes before pushing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      - name: Commit and push changes to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update word count history [skip ci]"
          file_pattern: word_history.csv
