name: Track Overleaf Word Count

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-word-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TeXcount Script
        run: |
          curl -sL https://raw.githubusercontent.com/pleac/texcount/master/texcount.pl -o texcount.pl
          chmod +x texcount.pl

- name: Calculate Word Count
        id: count
        run: |
          # 1. Check if the file actually exists where you claim it is
          if [ ! -f "main.tex" ]; then
            echo "ERROR: main.tex not found in the root directory!"
            exit 1 # Fail the build so you notice it
          fi

          # 2. Run texcount (-1 forces a single line output)
          RAW_OUTPUT=$(texcount -1 -sum -merge main.tex 2>/dev/null)
          echo "Raw texcount output: $RAW_OUTPUT"
          
          # 3. Aggressively strip everything except numbers
          CLEAN_COUNT=$(echo "$RAW_OUTPUT" | tr -dc '0-9')
          
          # 4. Fallback if empty
          if [ -z "$CLEAN_COUNT" ]; then
            CLEAN_COUNT=0
          fi
          
          echo "word_count=$CLEAN_COUNT" >> $GITHUB_OUTPUT
          echo "Current word count: $CLEAN_COUNT"
